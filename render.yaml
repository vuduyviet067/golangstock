# Render Blueprint (DEP-03): one web service built from ./Dockerfile.
# Secrets are never written here: JWT_SECRET is generated by Render, and the
# sync: false values are entered in the dashboard when the Blueprint is first
# created (Render does not prompt for them again on later Blueprint syncs).
services:
  - type: web
    name: gostock
    runtime: docker
    plan: free
    region: singapore
    branch: master
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      # Render's default web service port; the server listens on 0.0.0.0.
      - key: HTTP_PORT
        value: "10000"
      - key: ALLOW_REGISTRATION
        value: "false"
      # Random base64-encoded 256-bit value, created only if it does not exist.
      - key: JWT_SECRET
        generateValue: true
      # Neon direct (non-pooled) connection string with sslmode=require.
      - key: DATABASE_URL
        sync: false
      # Name of the Neon database, for example gostock.
      - key: EXPECTED_DATABASE_NAME
        sync: false
      # The app's own https address, for example https://gostock.onrender.com.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
